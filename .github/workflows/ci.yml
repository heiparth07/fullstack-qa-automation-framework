name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm -w backend run build
      - run: npm run lint

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Initialize database
        run: psql -f docker/init-db/01-init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: taskmanager_test

      - name: Start backend
        run: |
          cd backend && npx tsx src/app.ts &
          sleep 3
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskmanager_test
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

      - name: Run API tests
        run: npm -w tests run test:api
        env:
          API_BASE_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx -w tests playwright install --with-deps chromium

      - name: Initialize database
        run: psql -f docker/init-db/01-init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: taskmanager_test

      - name: Start backend
        run: |
          cd backend && npx tsx src/app.ts &
          sleep 3
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskmanager_test
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

      - name: Build and serve frontend
        run: |
          cd frontend && npm run build
          npx serve -s dist -l 3000 &
          sleep 3

      - name: Run UI tests (Chromium)
        run: npm -w tests run test:ui -- --project=chromium
        env:
          FRONTEND_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/

  performance-smoke:
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    needs: [api-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Initialize database
        run: psql -f docker/init-db/01-init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: taskmanager_test

      - name: Start backend
        run: |
          cd backend && npx tsx src/app.ts &
          sleep 3
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskmanager_test
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

      - name: Run k6 smoke test
        run: k6 run tests/performance/scripts/smoke.js
        env:
          API_BASE_URL: http://localhost:3001
